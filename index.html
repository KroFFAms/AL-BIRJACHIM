<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AL-BIRJACHIM — aktiv lotlar</title>
<style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#16202c;--mut:#677487;--line:#e2e8ef;--pri:#1d5fa8;--pri2:#0e8a7a;--ok:#16a06a;--warn:#e08a00;--bad:#d64545;--chip:#eef3f8;--sh:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
  --c1:#1d5fa8;--c2:#0e8a7a;--c3:#7c4dce;--c4:#e08a00;--c5:#d64545;--c6:#2f9e44;--c7:#c2255c;--c8:#1098ad;--c9:#5f6b7a}
@media (prefers-color-scheme:dark){:root{--bg:#0d131a;--card:#151d27;--ink:#e7edf3;--mut:#93a1b2;--line:#253141;--pri:#5aa2ef;--pri2:#33c2ad;--ok:#3fcf8e;--warn:#f5a524;--bad:#f07070;--chip:#1e2834;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:linear-gradient(120deg,#123a66 0%,#1d5fa8 55%,#0e8a7a 100%);color:#fff;padding:18px 16px 54px}
header>div{max-width:1200px;margin:0 auto}
header h1{margin:0;font-size:22px;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
header h1 .lg{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.16);font-size:18px}
header .sub{opacity:.85;font-size:12.5px;margin-top:6px}
main{max-width:1200px;margin:-40px auto 0;padding:0 16px 40px}
.tabs{display:flex;gap:4px;margin:0 0 14px;background:var(--card);padding:5px;border-radius:12px;box-shadow:var(--sh);overflow-x:auto}
.tab{border:0;background:transparent;color:var(--mut);padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--chip)}
.tab.on{background:var(--pri);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:18px}
.stat span{color:var(--mut);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.bar input[type=search],.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px}
.bar input[type=search]{flex:1;min-width:180px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer;font-size:12.5px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip small{opacity:.75}
label.tg{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--card);font-size:12px;color:var(--mut);cursor:pointer;white-space:nowrap;user-select:none}
th.num,td.num{text-align:right;white-space:nowrap}
tr.end td{opacity:.45}
.g{font-size:11px;color:var(--mut)}
.left{font-size:11.5px;font-weight:600}
.left.s{color:var(--bad)}.left.m{color:var(--warn)}.left.l{color:var(--ok)}
a{color:var(--pri)}
.more{display:block;margin:12px auto;padding:9px 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.note{color:var(--mut);font-size:12px;margin:10px 2px}
.err{background:#fde8e6;color:#8a1c12;padding:12px;border-radius:8px}
.kb{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-top:3px;font-size:10.5px;color:var(--ink)}
.hl{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.hl.yutdi{background:#e3f6ec;color:#1a7f4b}.hl.yutqazdi{background:#fde8e6;color:#b42318}.hl.bitim_yoq{background:var(--chip);color:var(--mut)}.hl.kutilmoqda{background:#fff4e0;color:#a15c00}
.bar[hidden],.more[hidden],.tw[hidden]{display:none}
#dash h3{font-size:13px;margin:22px 2px 10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.k{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s,border-color .15s}
.k:hover{transform:translateY(-2px);border-color:var(--ac,var(--pri));box-shadow:0 8px 24px rgba(16,24,40,.12)}
.k::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--ac,var(--pri));opacity:.08}
.k .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--ac,var(--pri)) 14%,transparent);margin-bottom:10px}
.k .t{font-size:12.5px;color:var(--mut);font-weight:600}
.k .v{font-size:30px;font-weight:800;line-height:1.15;margin-top:2px;color:var(--ac,var(--ink))}
.k .s{font-size:12px;color:var(--mut);margin-top:4px}
.k .go{position:absolute;right:14px;bottom:12px;font-size:12px;color:var(--ac,var(--pri));font-weight:700;opacity:0;transition:opacity .15s}
.k:hover .go{opacity:1}
@media(max-width:600px){.kp{grid-template-columns:1fr 1fr;gap:10px}.k{padding:13px}.k .v{font-size:24px}.k .s{font-size:11px}.br{grid-template-columns:110px 1fr 80px}}
.row2{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
@media(max-width:860px){.row2{grid-template-columns:1fr}}
.pn{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.pn h4{margin:0 0 12px;font-size:15px}
.br{display:grid;grid-template-columns:150px 1fr 92px;align-items:center;gap:10px;padding:7px 6px;border-radius:9px;cursor:pointer}
.br:hover{background:var(--chip)}
.br .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .tr{height:12px;background:var(--chip);border-radius:6px;overflow:hidden}
.br .fl{height:100%;border-radius:6px;background:var(--ac)}
.br .m{font-size:12.5px;text-align:right;color:var(--mut)}.br .m b{color:var(--ink)}
.dn{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dn .ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex:none}
.dn .ring>div{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.dn .ring b{font-size:26px;display:block}.dn .ring span{font-size:11px;color:var(--mut)}
.lg2{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px}
.lg2 button{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:inherit;padding:6px 8px;border-radius:8px;cursor:pointer;text-align:left}
.lg2 button:hover{background:var(--chip)}
.lg2 i{width:10px;height:10px;border-radius:3px;flex:none}
.lg2 b{margin-left:auto}
.kx{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.kc{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.kc:hover{transform:translateY(-2px);border-color:var(--ac)}
.kc .av{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;background:var(--ac);flex:none}
.kc .v{font-size:20px;font-weight:800}.kc .s{font-size:12px;color:var(--mut)}
.kc .pb{height:6px;background:var(--chip);border-radius:3px;margin-top:6px;overflow:hidden}.kc .pb i{display:block;height:100%;background:var(--ac)}
.tl{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.tl a{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.tl a:last-child{border-bottom:0}.tl a:hover{background:var(--chip)}
.tl .no{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--chip);font-weight:700;font-size:12px;color:var(--mut)}
.tl .nm{font-weight:600;font-size:13.5px}.tl .gp{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;color:#fff;background:var(--ac);margin-left:6px;vertical-align:1px}
.tl .rt{text-align:right}.tl .rt b{font-size:15px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:3px}
.pill.s{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}.pill.m{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.pill.l{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.prods{font-size:12px;color:var(--mut);max-width:420px}
</style>
</head>
<body>
<header>
  <div><h1><span class="lg">📊</span>AL-BIRJACHIM</h1>
  <div class="sub" id="sub">Yuklanmoqda…</div></div>
</header>
<main>
  <div class="tabs">
    <button class="tab on" data-t="d">Bosh sahifa</button>
    <button class="tab" data-t="e">Elektron do'kon</button>
    <button class="tab" data-t="a">Auksion</button>
    <button class="tab" data-t="n">Natijalar</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="bar" id="nbar" hidden>
    <select id="nHolat">
      <option value="">Holat: hammasi</option>
      <option value="yutdi">✅ Bizga chiqdi</option>
      <option value="yutqazdi">❌ Chiqmadi</option>
      <option value="bitim_yoq">⚪ Bitim bo'lmadi</option>
      <option value="kutilmoqda">⏳ Kutilmoqda</option>
    </select>
    <select id="nKorx"><option value="">Korxona: hammasi</option></select>
    <input type="search" id="nq" placeholder="Qidirish: mahsulot, lot №, g'olib…">
  </div>
  <div class="bar" id="ebar">
    <input type="search" id="q" placeholder="Qidirish: mahsulot, lot №, buyurtmachi…">
    <select id="korx" title="Qaysi korxona kabinetida chiqqan">
      <option value="">Korxona: hammasi</option>
    </select>
    <select id="vaqt">
      <option value="">Tugash: hammasi</option>
      <option value="24">24 soat ichida</option>
      <option value="48">48 soat ichida</option>
    </select>
    <select id="minSoni" title="Kam donali lotlarni yashirish">
      <option value="0">Soni: hammasi</option>
      <option value="3">Soni ≥ 3</option>
      <option value="5">Soni ≥ 5</option>
      <option value="10">Soni ≥ 10</option>
    </select>
    <select id="minSum" title="Kichik summali lotlarni yashirish">
      <option value="0">Summa: hammasi</option>
      <option value="5">Summa ≥ 5 mln</option>
      <option value="10">Summa ≥ 10 mln</option>
      <option value="20">Summa ≥ 20 mln</option>
      <option value="50">Summa ≥ 50 mln</option>
      <option value="100">Summa ≥ 100 mln</option>
    </select>
    <select id="sort">
      <option value="end">Tartib: tugash vaqti</option>
      <option value="sum">Tartib: jami summa ↓</option>
      <option value="price">Tartib: dona narxi ↓</option>
    </select>
    <label class="tg" id="mosWrap"><input type="checkbox" id="mos" checked> Faqat bizga mos</label>
    <label class="tg"><input type="checkbox" id="tugagan"> Tugaganlarni ham</label>
  </div>
  <div class="chips" id="chips"></div>
  <div id="dash"></div>
  <div class="tw" id="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
  <button class="more" id="more" hidden>Yana ko'rsatish</button>
  <p class="note" id="note"></p>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ');
const mln=n=>(n/1e6).toLocaleString('ru-RU',{maximumFractionDigits:1})+' mln';
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>pad(d.getDate())+'.'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Korxona nomini qisqartirish
const qisqa=n=>/ANVARJON|AMS/i.test(n)?'AMS':/KROFF/i.test(n)?'KROFF':/DRIVE/i.test(n)?'Drive':String(n).replace(/["«»]/g,'').split(/\s+/).slice(0,2).join(' ');
const MOS=['Elektr','Santexnika','Sement/beton/blok','Metall prokat','Asbob/mayda','Yogoch/plita','Boyoq/kimyo','Tom/devor qoplama','Eshik/deraza'];
let D={e:[],a:[]},tab='d',guruh='',limit=100,sortKey='end';

function left(end){
  const h=(end-Date.now())/36e5;
  if(h<=0)return '<span class="left">tugagan</span>';
  const cls=h<6?'s':h<24?'m':'l';
  const t=h<1?Math.round(h*60)+' daq':h<48?Math.floor(h)+' soat':Math.floor(h/24)+' kun';
  return '<span class="left '+cls+'">'+t+' qoldi</span>';
}

// Ma'lumot manbai: avval Supabase Edge Function, ishlamasa — yonidagi lotlar.json
const API='https://dbdtnujcospnsuwwazbs.supabase.co/functions/v1/birja';
async function olish(){
  try{
    const r=await fetch(API,{cache:'no-store'});
    if(r.ok)return await r.json();
  }catch(e){}
  const r=await fetch('lotlar.json?v='+Date.now());
  if(!r.ok)throw new Error('HTTP '+r.status);
  return await r.json();
}
async function load(){
  try{
    const j=await olish();
    D.e=j.edokon.map(x=>({lot:x[0],g:x[1],name:x[2],qty:x[3],price:x[4],sum:x[3]*x[4],end:new Date(x[5]),k:Array.isArray(x[6])?x[6]:[],url:'https://xarid.uzex.uz/shop/lot-details/'+String(x[0]).slice(-7)}));
    D.a=j.auksion.map(x=>({id:x[0],lot:x[1],tur:x[2],cust:x[3],cat:x[4],sum:x[5],price:0,end:new Date(x[6]),n:x[7],name:x[8],url:'https://xarid.uzex.uz/auction/detail/'+x[0]}));
    const K=j.korxonalar||[];D.korxonalar=K;
    $('sub').textContent=K.length
      ?'Korxonalar: '+K.map(k=>qisqa(k.nom)+' ('+dstr(new Date(k.yangilangan))+')').join(' · ')
      :'Yangilangan: '+dstr(new Date(j.yangilangan))+' · '+j.manba;
    $('korx').innerHTML='<option value="">Korxona: hammasi</option>'+K.map(k=>'<option value="'+esc(k.nom)+'">'+esc(qisqa(k.nom))+'</option>').join('');
    $('korx').style.display=K.length>0?'':'none';
    render();
  }catch(e){
    $('tb').innerHTML='';
    $('stats').innerHTML='<div class="err">lotlar.json yuklanmadi ('+esc(e.message)+'). Sahifani GitHub Pages orqali oching, fayl bilan bir papkada bo\'lsin.</div>';
  }
}

function rows(){
  const q=$('q').value.trim().toLowerCase();
  const v=+$('vaqt').value, now=Date.now();
  const showEnd=$('tugagan').checked, mos=$('mos').checked;
  const minSoni=+$('minSoni').value, minSum=+$('minSum').value*1e6, korx=$('korx').value;
  let L=D[tab].filter(x=>{
    if(!showEnd&&x.end<=now)return false;
    if(x.sum<minSum)return false;
    if(tab==='e'&&x.qty<minSoni)return false;
    if(tab==='e'&&korx&&!x.k.includes(korx))return false;
    if(v&&(x.end-now)>v*36e5)return false;
    if(tab==='e'){
      if(mos&&!MOS.includes(x.g))return false;
      if(guruh&&x.g!==guruh)return false;
    }else if(guruh&&x.cat!==guruh)return false;
    if(q){
      const s=(x.lot+' '+x.name+' '+(x.cust||'')+' '+(x.cat||'')+' '+(x.g||'')).toLowerCase();
      if(!s.includes(q))return false;
    }
    return true;
  });
  const k=sortKey;
  L.sort((a,b)=>k==='end'?a.end-b.end:k==='sum'?b.sum-a.sum:b.price-a.price);
  return L;
}

function chips(){
  const now=Date.now(),c={};
  const showEnd=$('tugagan').checked;
  const minSoni=+$('minSoni').value, minSum=+$('minSum').value*1e6;
  D[tab].forEach(x=>{
    if(!showEnd&&x.end<=now)return;
    if(x.sum<minSum)return;
    if(tab==='e'&&x.qty<minSoni)return;
    if(tab==='e'&&$('korx').value&&!x.k.includes($('korx').value))return;
    const k=tab==='e'?x.g:x.cat;
    if(tab==='e'&&$('mos').checked&&!MOS.includes(k))return;
    c[k]=c[k]||{n:0,s:0};c[k].n++;c[k].s+=x.sum;
  });
  const arr=Object.entries(c).sort((a,b)=>b[1].n-a[1].n);
  if(guruh&&!c[guruh])guruh='';
  $('chips').innerHTML='<button class="chip'+(guruh?'':' on')+'" data-g="">Hammasi</button>'+
    arr.map(([k,v])=>'<button class="chip'+(k===guruh?' on':'')+'" data-g="'+esc(k)+'">'+esc(tab==='a'?k.slice(0,38):k)+' <small>'+v.n+' · '+mln(v.s)+'</small></button>').join('');
}

const HOLAT={yutdi:'✅ Bizga chiqdi',yutqazdi:'❌ Chiqmadi',bitim_yoq:"⚪ Bitim bo'lmadi",kutilmoqda:'⏳ Kutilmoqda'};
let N=null,nYuk=false;
async function loadN(){
  if(nYuk)return;nYuk=true;
  try{const r=await fetch(API+'?natijalar=1',{cache:'no-store'});N=r.ok?await r.json():[];}catch(e){N=[];}
  nYuk=false;
  const ks=[...new Set(N.map(x=>x.korxona))];
  $('nKorx').innerHTML='<option value="">Korxona: hammasi</option>'+ks.map(k=>'<option value="'+esc(k)+'">'+esc(qisqa(k))+'</option>').join('');
  if(tab==='n')renderN();
  if(tab==='d')renderD();
}
function renderN(){
  $('ebar').hidden=true;$('nbar').hidden=false;$('chips').innerHTML='';$('more').hidden=true;
  if(!N){$('stats').innerHTML='';$('th').innerHTML='';$('tb').innerHTML='<tr><td class="note">Yuklanmoqda…</td></tr>';loadN();return;}
  const h=$('nHolat').value,k=$('nKorx').value,q=$('nq').value.trim().toLowerCase();
  const all=N.filter(x=>!k||x.korxona===k);
  const L=all.filter(x=>(!h||x.holat===h)&&(!q||(x.lot+' '+(x.nomi||'')+' '+(x.golib||'')).toLowerCase().includes(q)));
  const c=s=>all.filter(x=>x.holat===s).length, yut=c('yutdi'), yq=c('yutqazdi');
  $('stats').innerHTML=
    '<div class="stat"><b>'+all.length+'</b><span>narx bergan lotlar</span></div>'+
    '<div class="stat"><b style="color:var(--ok)">'+yut+'</b><span>bizga chiqdi</span></div>'+
    '<div class="stat"><b style="color:var(--bad)">'+yq+'</b><span>chiqmadi</span></div>'+
    '<div class="stat"><b>'+((yut+yq)?Math.round(yut/(yut+yq)*100)+'%':'—')+'</b><span>yutish ulushi · ⏳ '+c('kutilmoqda')+' kutilmoqda</span></div>';
  $('th').innerHTML='<tr><th>Tugash</th><th>Korxona</th><th>Mahsulot / lot</th><th class="num">Soni</th><th class="num">Bizning narx</th><th>Natija</th><th>G\'olib</th><th class="num">G\'olib narxi</th><th class="num">Farq</th><th class="num">Ishtirokchi</th><th></th></tr>';
  $('tb').innerHTML=L.map(x=>{
    const farq=x.bizning_narx&&x.dona_narx?Math.round((x.bizning_narx-x.dona_narx)/x.bizning_narx*100):null;
    return '<tr><td>'+(x.tugash?dstr(new Date(x.tugash)):'')+'</td><td><span class="kb">'+esc(qisqa(x.korxona))+'</span></td>'+
      '<td>'+esc(x.nomi||'')+'<div class="g">'+esc(x.lot)+(x.buyurtmachi?' · '+esc(x.buyurtmachi):'')+'</div></td>'+
      '<td class="num">'+fmt(x.soni||0)+'</td><td class="num">'+(x.bizning_narx?fmt(x.bizning_narx):'')+'</td>'+
      '<td><span class="hl '+x.holat+'">'+(HOLAT[x.holat]||x.holat)+'</span></td>'+
      '<td>'+(x.golib?esc(x.golib)+'<div class="g">STIR '+esc(x.golib_stir||'')+'</div>':'')+'</td>'+
      '<td class="num">'+(x.dona_narx?'<b>'+fmt(x.dona_narx)+'</b><div class="g">jami '+fmt(x.shartnoma_summa||0)+'</div>':'')+'</td>'+
      '<td class="num">'+(farq!==null&&x.holat==='yutqazdi'?farq+'%':'')+'</td>'+
      '<td class="num">'+(x.ishtirokchilar??'')+'</td>'+
      '<td><a href="https://xarid.uzex.uz/shop/lot-details/'+String(x.lot).slice(-7)+'" target="_blank" rel="noopener">Ochish</a></td></tr>';
  }).join('')||'<tr><td colspan="11" class="note">Hali natija yo\'q. Narx bergan lotlar tugagach, keyingi yangilashda shu yerda chiqadi.</td></tr>';
  $('note').textContent='Narx bergan lotlarimiz natijasi "Amalga oshgan bitimlar" ochiq ma\'lumotidan olinadi. Farq — g\'olib narxi bizning narxdan necha foiz past.';
}
// ---------- Bosh sahifa (dashboard) ----------
function qiziqmi(x){return MOS.includes(x.g)&&x.qty>=3&&x.sum>=10e6;}
function ochish(t,o){
  o=o||{};
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  tab=t;guruh=o.guruh||'';limit=100;
  if(t==='e'){
    $('korx').value=o.korx||'';$('vaqt').value=o.vaqt||'';$('q').value='';
    if(o.hammasi){$('minSoni').value='0';$('minSum').value='0';$('mos').checked=false;}
    else{$('mos').checked=true;if(o.qiziq){$('minSoni').value='3';$('minSum').value='10';}}
  }
  if(t==='a'){$('vaqt').value=o.vaqt||'';}
  if(t==='n'){$('nHolat').value=o.holat||'';$('nKorx').value=o.korx||'';}
  render();window.scrollTo({top:0,behavior:'smooth'});
}
const GC={'Elektr':'--c1','Sement/beton/blok':'--c9','Metall prokat':'--c3','Santexnika':'--c8','Asbob/mayda':'--c4','Yogoch/plita':'--c6','Boyoq/kimyo':'--c7','Tom/devor qoplama':'--c2','Eshik/deraza':'--c5'};
const gcol=g=>'var('+(GC[g]||'--c9')+')';
const KC={AMS:'#c2255c',KROFF:'#1d5fa8',Drive:'#0e8a7a'};
const go=o=>"data-go='"+JSON.stringify(o).replace(/'/g,'&#39;')+"'";
function qoldi(end){const h=(end-Date.now())/36e5;if(h<=0)return '<span class="pill">tugagan</span>';const c=h<6?'s':h<24?'m':'l';return '<span class="pill '+c+'">'+(h<1?Math.round(h*60)+' daq':h<48?Math.floor(h)+' soat':Math.floor(h/24)+' kun')+'</span>';}
function renderD(){
  $('ebar').hidden=true;$('nbar').hidden=true;$('tw').hidden=true;$('more').hidden=true;$('chips').innerHTML='';$('stats').innerHTML='';
  $('note').textContent='Istalgan kartochka yoki qatorni bossangiz, tegishli bo\'lim shu filtr bilan ochiladi.';
  if(!N)loadN();
  const now=Date.now(),day=864e5;
  const E=D.e.filter(x=>x.end>now), Q=E.filter(qiziqmi), A=D.a.filter(x=>x.end>now);
  const s=L=>L.reduce((a,x)=>a+x.sum,0);
  const Q24=Q.filter(x=>x.end-now<=day);
  const nn=N||[], c=h=>nn.filter(x=>x.holat===h).length;
  const kpi=(ic,t,v,sub,o,ac)=>'<button class="k" style="--ac:var('+ac+')" '+go(o)+'><div class="ic">'+ic+'</div><div class="t">'+t+'</div><div class="v">'+v+'</div><div class="s">'+sub+'</div><span class="go">Ochish →</span></button>';
  let h='<div class="kp">'+
    kpi('🎯','Qo\'lga ilinadigan lotlar',Q.length,'jami <b>'+mln(s(Q))+'</b> · soni ≥ 3, summa ≥ 10 mln',{t:'e',qiziq:1},'--c1')+
    kpi('⏰','24 soatda tugaydi',Q24.length,'<b>'+mln(s(Q24))+'</b> — shoshilish kerak',{t:'e',qiziq:1,vaqt:'24'},'--c5')+
    kpi('🛒','Elektron do\'kon',E.length,'aktiv lotlar · '+mln(s(E)),{t:'e',hammasi:1},'--c2')+
    kpi('🔨','Auksion',A.length,'aktiv lotlar · '+mln(s(A)),{t:'a'},'--c3')+
  '</div>';
  // Guruhlar diagrammasi + Natijalar doirasi
  const G={};Q.forEach(x=>{(G[x.g]=G[x.g]||[]).push(x)});
  const GL=Object.entries(G).sort((a,b)=>s(b[1])-s(a[1]));const gmax=Math.max(1,...GL.map(([,L])=>s(L)));
  const bars=GL.map(([g,L])=>'<div class="br" style="--ac:'+gcol(g)+'" '+go({t:'e',qiziq:1,guruh:g})+'><div class="n">'+esc(g)+'</div><div class="tr"><div class="fl" style="width:'+Math.max(3,s(L)/gmax*100)+'%"></div></div><div class="m"><b>'+L.length+'</b> · '+mln(s(L))+'</div></div>').join('')||'<div class="note">Ma\'lumot yo\'q</div>';
  const y=c('yutdi'),yq=c('yutqazdi'),kt=c('kutilmoqda'),bt=c('bitim_yoq'),tot=y+yq+kt+bt;
  const p1=tot?y/tot*100:0,p2=tot?(y+yq)/tot*100:0,p3=tot?(y+yq+kt)/tot*100:0;
  const ring=tot?'conic-gradient(var(--ok) 0 '+p1+'%,var(--bad) '+p1+'% '+p2+'%,var(--warn) '+p2+'% '+p3+'%,var(--mut) '+p3+'% 100%)':'conic-gradient(var(--chip) 0 100%)';
  const leg=(col,t,n,hol)=>'<button '+go({t:'n',holat:hol})+'><i style="background:'+col+'"></i>'+t+'<b>'+(N?n:'…')+'</b></button>';
  h+='<div class="row2" style="margin-top:12px"><div class="pn"><h4>📦 Guruhlar bo\'yicha — qo\'lga ilinadigan lotlar</h4>'+bars+'</div>'+
    '<div class="pn"><h4>🏁 Narx bergan lotlarimiz</h4><div class="dn"><div class="ring" style="background:'+ring+'"><div><div><b>'+((y+yq)?Math.round(y/(y+yq)*100)+'%':'—')+'</b><span>yutish ulushi</span></div></div></div>'+
    '<div class="lg2">'+leg('var(--ok)','✅ Bizga chiqdi',y,'yutdi')+leg('var(--bad)','❌ Chiqmadi',yq,'yutqazdi')+leg('var(--warn)','⏳ Kutilmoqda',kt,'kutilmoqda')+leg('var(--mut)','⚪ Bitim bo\'lmadi',bt,'bitim_yoq')+'</div></div></div></div>';
  // Korxonalar
  const K=[...new Set(D.e.flatMap(x=>x.k))];
  if(K.length){
    const kmax=Math.max(1,...K.map(k=>Q.filter(x=>x.k.includes(k)).length));
    h+='<h3>Korxonalar</h3><div class="kx">'+K.map(k=>{
      const L=Q.filter(x=>x.k.includes(k)),kk=(D.korxonalar||[]).find(z=>z.nom===k),q=qisqa(k),ac=KC[q]||'#5f6b7a';
      return '<button class="kc" style="--ac:'+ac+'" '+go({t:'e',qiziq:1,korx:k})+'><div class="av">'+esc(q.slice(0,5))+'</div><div style="flex:1;min-width:0"><div class="v">'+L.length+' <span class="s">qo\'lga ilinadigan</span></div><div class="s">'+mln(s(L))+(kk?' · 🕒 '+dstr(new Date(kk.yangilangan)):'')+'</div><div class="pb"><i style="width:'+(L.length/kmax*100)+'%"></i></div></div></button>';
    }).join('')+'</div>';
  }
  // Eng katta lotlar
  const top=Q.slice().sort((a,b)=>b.sum-a.sum).slice(0,8);
  if(top.length)h+='<h3>Eng katta lotlar</h3><div class="tl">'+top.map((x,i)=>'<a href="'+x.url+'" target="_blank" rel="noopener" style="--ac:'+gcol(x.g)+'"><span class="no">'+(i+1)+'</span><span><span class="nm">'+esc(x.name)+'</span><span class="gp">'+esc(x.g)+'</span><div class="g">'+fmt(x.qty)+' × '+fmt(x.price)+' so\'m'+(x.k.length?' · '+x.k.map(qisqa).join(', '):'')+'</div></span><span class="rt"><b>'+mln(x.sum)+'</b><br>'+qoldi(x.end)+'</span></a>').join('')+'</div>';
  $('dash').innerHTML=h;
}
$('dash').onclick=e=>{const b=e.target.closest('[data-go]');if(!b)return;const o=JSON.parse(b.dataset.go);ochish(o.t,o);};

function render(){
  if(tab==='d'){$('dash').hidden=false;renderD();return;}
  $('dash').hidden=true;$('dash').innerHTML='';$('tw').hidden=false;
  if(tab==='n'){renderN();return;}
  $('ebar').hidden=false;$('nbar').hidden=true;
  $('mosWrap').style.display=tab==='e'?'':'none';
  $('minSoni').style.display=tab==='e'?'':'none';
  $('korx').disabled=tab!=='e';
  $('sort').querySelector('[value=price]').hidden=tab!=='e';
  if(tab!=='e'&&sortKey==='price')sortKey='end';
  $('sort').value=sortKey;
  chips();
  const L=rows(),now=Date.now();
  const tot=L.reduce((a,x)=>a+x.sum,0);
  const d24=L.filter(x=>x.end>now&&x.end-now<=864e5).length;
  $('stats').innerHTML=
    '<div class="stat"><b>'+L.length+'</b><span>lot (filtr bo\'yicha)</span></div>'+
    '<div class="stat"><b>'+mln(tot)+'</b><span>jami summa</span></div>'+
    '<div class="stat"><b>'+(L.length?mln(tot/L.length):'0')+'</b><span>o\'rtacha lot</span></div>'+
    '<div class="stat"><b>'+d24+'</b><span>24 soatda tugaydi</span></div>';
  const ar=k=>sortKey===k?' ▾':'';
  $('th').innerHTML=tab==='e'
    ?'<tr><th>Lot №</th><th>Mahsulot</th><th class="num">Soni</th><th class="num" data-s="price">Dona narxi'+ar('price')+'</th><th class="num" data-s="sum">Jami summa'+ar('sum')+'</th><th data-s="end">Savdo tugashi'+ar('end')+'</th><th></th></tr>'
    :'<tr><th>Lot №</th><th>Buyurtmachi / toifa</th><th>Mahsulotlar</th><th class="num" data-s="sum">Boshlang\'ich summa'+ar('sum')+'</th><th data-s="end">Savdo tugashi'+ar('end')+'</th><th></th></tr>';
  const view=L.slice(0,limit);
  $('tb').innerHTML=view.map(x=>{
    const cls=x.end<=now?' class="end"':'';
    if(tab==='e')return '<tr'+cls+'><td>'+esc(x.lot)+(x.k.length?'<div class="g">'+x.k.map(k=>'<span class="kb">'+esc(qisqa(k))+'</span>').join(' ')+'</div>':'')+'</td><td>'+esc(x.name)+'<div class="g">'+esc(x.g)+'</div></td><td class="num">'+x.qty.toLocaleString('ru-RU',{maximumFractionDigits:2}).replace(/ /g,' ')+'</td><td class="num">'+fmt(x.price)+'</td><td class="num"><b>'+fmt(x.sum)+'</b></td><td>'+dstr(x.end)+'<br>'+left(x.end)+'</td><td><a href="'+x.url+'" target="_blank" rel="noopener">Ochish</a></td></tr>';
    return '<tr'+cls+'><td>'+esc(x.lot)+'<div class="g">'+esc(x.tur)+'</div></td><td>'+esc(x.cust)+'<div class="g">'+esc(x.cat)+'</div></td><td class="prods">'+esc(x.name)+(x.n>1?' <span class="g">('+x.n+' xil)</span>':'')+'</td><td class="num"><b>'+fmt(x.sum)+'</b></td><td>'+dstr(x.end)+'<br>'+left(x.end)+'</td><td><a href="'+x.url+'" target="_blank" rel="noopener">Ochish</a></td></tr>';
  }).join('')||'<tr><td colspan="7" class="note">Hech narsa topilmadi.</td></tr>';
  $('more').hidden=L.length<=limit;
  $('more').textContent='Yana ko\'rsatish ('+(L.length-limit)+' ta qoldi)';
  $('note').textContent=tab==='e'
    ?'Dona narxi — saytdagi boshlang\'ich narx (1 birlik uchun). Jami summa = soni × dona narxi. Guruhlar mahsulot nomi bo\'yicha avtomatik ajratilgan.'
    :'Auksionda summa butun lot uchun; bitta lotda bir nechta tovar bo\'lishi mumkin.';
}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  tab=b.dataset.t;guruh='';limit=100;render();
});
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;guruh=b.dataset.g;limit=100;render();};
$('th').onclick=e=>{const t=e.target.closest('th[data-s]');if(!t)return;sortKey=t.dataset.s;render();};
['q','vaqt','mos','tugagan','korx'].forEach(id=>$(id).addEventListener('input',()=>{limit=100;render();}));
// Min soni / Min summa: standart 3 dona va 10 mln, tanlov shu brauzerda eslab qolinadi
const SAQ='birjachim_filtr';
try{const s=JSON.parse(localStorage.getItem(SAQ)||'null');if(s){$('minSoni').value=s.soni;$('minSum').value=s.sum;}else{$('minSoni').value='3';$('minSum').value='10';}}
catch(e){$('minSoni').value='3';$('minSum').value='10';}
['minSoni','minSum'].forEach(id=>$(id).addEventListener('change',()=>{
  try{localStorage.setItem(SAQ,JSON.stringify({soni:$('minSoni').value,sum:$('minSum').value}));}catch(e){}
  limit=100;render();
}));
$('sort').onchange=()=>{sortKey=$('sort').value;render();};
$('more').onclick=()=>{limit+=100;render();};
setInterval(()=>{if(!document.hidden)render();},60000);
['nHolat','nKorx','nq'].forEach(id=>$(id).addEventListener('input',renderN));
load();
</script>
</body>
