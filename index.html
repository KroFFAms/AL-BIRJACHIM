<!DOCTYPE html>

<head>

<style>
:root{--bg:#f3f5f9;--card:#fff;--line:#e3e8f0;--tx:#18212f;--mut:#667085;--acc:#2f6fed;--acc2:#e9f0ff;--ok:#12a150;--bad:#e5484d;--warn:#d98a00;--inp:#fff;--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.05);--side:#0f1b33;--sidetx:#b8c4dc}
[data-theme=dark]{--bg:#0e1420;--card:#161e2e;--line:#253046;--tx:#e8edf6;--mut:#8e9ab0;--acc:#5b92ff;--acc2:#1b2947;--ok:#3ccf7e;--bad:#ff6b6f;--warn:#f0b13a;--inp:#111a2a;--shadow:none;--side:#09101c;--sidetx:#9fb0cc}
*{box-sizing:border-box}
html{color-scheme:light}[data-theme=dark]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}.mainw{flex:1;min-width:0}
.side{display:none}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ttl{font-size:18px;font-weight:700;flex:1;min-width:140px;letter-spacing:-.01em}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.syn{font-size:12px;color:var(--mut)}
main{padding:16px;max-width:1200px;margin:0 auto;padding-bottom:96px}
select,input,textarea{width:100%;background:var(--inp);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit}
select:focus,input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
.co{width:auto;min-width:150px;font-weight:600}.mo{width:150px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);color:#fff;border:0;font-weight:600}button.p:hover{filter:brightness(1.08)}
button.s{padding:5px 10px;font-size:13px}.ib{width:38px;padding:8px 0;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:12px;margin:0 0 10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.card.bad{border-color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:14px}
.kpi{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.kpi small{color:var(--mut);display:block;font-size:12px}.kpi b{font-size:22px;letter-spacing:-.02em;display:block;margin:2px 0}.dl{font-size:12px}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--acc2);color:var(--acc)}
.ic.ok{background:rgba(18,161,80,.12);color:var(--ok)}.ic.bad{background:rgba(229,72,77,.12);color:var(--bad)}.ic.warn{background:rgba(217,138,0,.14);color:var(--warn)}
.g2,.g2e{display:grid;gap:14px;margin-bottom:14px}.g2>.card,.g2e>.card{margin-bottom:0}
.leg{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-top:6px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.don{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.item:first-of-type{border-top:0}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--acc2);color:var(--acc);font-weight:600}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:8px}.f .w{grid-column:1/-1}
.chat{max-height:48vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.m{padding:9px 13px;border-radius:14px;max-width:86%;white-space:pre-wrap}
.m.u{background:var(--acc);color:#fff;align-self:flex-end}.m.a{background:var(--acc2);align-self:flex-start}
.note{font-size:12px;color:var(--mut);margin-top:8px}
details.ck{border-top:1px solid var(--line);padding:10px 0}details.ck:first-of-type{border-top:0}details.ck summary{cursor:pointer}
label.mut{font-size:12px;display:block;margin-bottom:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chips button{font-size:12px;padding:6px 11px;border-radius:99px}
.paper{background:#fff;color:#111;padding:20px;border-radius:10px;border:1px solid var(--line);font:14px/1.55 'Times New Roman',Georgia,serif;overflow-x:auto}
.paper table{border-collapse:collapse;width:100%;margin:8px 0}.paper td,.paper th{border:1px solid #333;padding:4px 6px;font-size:13px}
.paper table.sg td{border:0;padding-top:22px}.paper h3{text-align:center;margin:12px 0}.paper .c{text-align:center}.paper .r{text-align:right}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,var(--acc),#6f9bff);color:#fff;border:0}
.hero h2{color:#e6eeff}.hero p{margin:0 0 8px}.hero button{background:#fff;color:#1d4ed8;border:0;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0);z-index:6}
nav button{flex:1 0 auto;min-width:64px;border:0;border-radius:0;background:none;color:var(--mut);padding:8px 8px;font-size:11px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:3px}

@media(max-width:600px){
 .top{padding:10px 12px;gap:6px}.ttl{font-size:16px;flex:1 0 100%}.ctl{width:100%;flex-wrap:nowrap}.co{flex:1;min-width:0}.mo{width:128px}
 main{padding:12px;padding-bottom:84px}
 .kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:12px;gap:8px;flex-direction:column;align-items:flex-start}.kpi b{font-size:18px}.ic{width:34px;height:34px}.dl .mut{display:none}
 .card{padding:14px}.g2,.g2e{grid-template-columns:1fr}
}
@media(min-width:900px){
 .side{display:flex;flex-direction:column;gap:2px;width:236px;flex:none;position:sticky;top:0;height:100vh;background:var(--side);padding:18px 12px;overflow:auto}
 .logo{font-weight:800;font-size:18px;color:#fff;padding:4px 12px 18px;display:flex;align-items:center;gap:10px}.logo .dot{width:26px;height:26px;border-radius:8px;background:var(--acc);display:grid;place-items:center;font-size:14px}
 .si{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--sidetx);cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:14px}
 .si:hover{background:rgba(255,255,255,.06)}.si.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
 .sfoot{margin-top:auto;font-size:12px;color:var(--sidetx);padding:10px 12px}
 nav{display:none}main{padding:22px;padding-bottom:40px}
 .g2{grid-template-columns:2fr 1fr}.g2e{grid-template-columns:1fr 1fr}
}

    </header>

<script>
const KEY='buxgalter_panel_v1', VAT=12;
const TABS=[['bosh','Bosh','Boshqaruv paneli'],['hujjat','Hujjat','Hujjatlar'],['bank','Bank','Bank va solishtirish'],['qqs','Soliq','Soliq hisobi'],['muddat','Muddat','Muddatlar'],['lot','Lotlar','Lotlar tahlili'],['arxiv','Arxiv','Hujjatlar arxivi'],['namuna','Namuna','Hujjat namunalari'],['bot','Yordamchi','Yordamchi'],['sozlama','Sozlama','Sozlamalar va bulut']];
const IC={bosh:'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10',hujjat:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M16 13H8 M16 17H8 M10 9H8',
 bank:'M2 5h20v14H2z M2 10h20',qqs:'M19 5L5 19 M7 5.5a2 2 0 1 0 .01 0 M17 16.5a2 2 0 1 0 .01 0',muddat:'M3 4h18v18H3z M16 2v4 M8 2v4 M3 10h18',
 arxiv:'M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z',namuna:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M12 18v-6 M9 15h6',
 bot:'M21 12a8 8 0 0 1-11.7 7L3 21l2-5.3A8 8 0 1 1 21 12z',sozlama:'M4 21v-7 M4 10V3 M12 21v-9 M12 8V3 M20 21v-5 M20 12V3 M1 14h6 M9 8h6 M17 16h6',
 lot:'M12 20V10 M18 20V4 M6 20v-4',up:'M23 6l-9.5 9.5-5-5L1 18 M17 6h6v6',cart:'M6 6h15l-1.5 9h-12z M6 6L5 2H2 M9 20a1 1 0 1 0 .01 0 M18 20a1 1 0 1 0 .01 0',money:'M12 1v22 M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6'};
const ico=(k,s)=>`<svg width="${s||20}" height="${s||20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[k]}"/></svg>`;
function applyTheme(){if(document.documentElement&&document.documentElement.setAttribute)document.documentElement.setAttribute('data-theme',S.theme==='dark'?'dark':'light')}
function blank(){return{docs:[],bank:[],dl:[],files:[],chat:[]}}
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.cos)return r}catch(e){}
  return{co:'KROFF',month:new Date().toISOString().slice(0,7),tab:'bosh',cos:{'KROFF':blank(),'AMS':blank(),'Drive Upgrade':blank()}};
}
let S=load();S.cfg=S.cfg||{};S.hash=S.hash||{};S.lastPull=S.lastPull||0;
const TAXDEF={'KROFF':{mode:'aylanma',rate:4},'AMS':{mode:'qqs',rate:12},'Drive Upgrade':{mode:'qqs',rate:12}};
Object.keys(S.cos).forEach(c=>{S.cos[c].tax=S.cos[c].tax||Object.assign({},TAXDEF[c]||{mode:'qqs',rate:12});S.cos[c].files=S.cos[c].files||[]});
function taxOf(d){return d.tax||{mode:'qqs',rate:12}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}syncSoon()}
const D=()=>S.cos[S.co];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const vatOf=d=>d.vat?d.sum*VAT/(100+VAT):0;

/* ---- hisob-kitob ---- */
function reconcile(d){
  const used=new Set(),by={};
  d.docs.forEach(doc=>{if(!doc.link)return;const b=d.bank.find(x=>x.id===doc.link&&!used.has(x.id));
    if(b){used.add(b.id);by[doc.id]={doc,b,st:b.sum===doc.sum?'ok':'diff',diff:b.sum-doc.sum,linked:true}}});
  d.docs.forEach(doc=>{
    if(by[doc.id])return;
    const dir=doc.type==='sotuv'?'in':'out';
    const c=d.bank.filter(b=>!used.has(b.id)&&b.dir===dir);
    let b=c.find(x=>x.sum===doc.sum);
    if(b){used.add(b.id);by[doc.id]={doc,b,st:'ok',diff:0};return}
    b=doc.no&&c.find(x=>x.desc.toLowerCase().includes(doc.no.toLowerCase()));
    if(b){used.add(b.id);by[doc.id]={doc,b,st:'diff',diff:b.sum-doc.sum};return}
    by[doc.id]={doc,b:null,st:'none',diff:0};
  });
  return{rows:d.docs.map(x=>by[x.id]),extra:d.bank.filter(b=>!used.has(b.id))};
}
function debts(d){
  const r=reconcile(d),rec={},pay={};
  r.rows.forEach(x=>{
    let amt=0;if(x.st==='none')amt=x.doc.sum;else if(x.st==='diff'&&x.diff<0)amt=-x.diff;
    if(amt<=0)return;
    const m=x.doc.type==='sotuv'?rec:pay,k=(x.doc.party||'(nomsiz)').trim(),kk=k.toLowerCase();
    m[kk]=m[kk]||{party:k,sum:0,n:0};m[kk].sum+=amt;m[kk].n++;
  });
  const f=m=>Object.values(m).sort((a,b)=>b.sum-a.sum);
  return{rec:f(rec),pay:f(pay)};
}
function debtsHtml(d){
  const db=debts(d),row=(a,c)=>a.slice(0,5).map(x=>`<div class="item"><span>${esc(x.party)} <span class="mut">(${x.n})</span></span><b class="${c}">${fmt(x.sum)}</b></div>`).join('')||'<div class="mut">—</div>';
  if(!db.rec.length&&!db.pay.length)return'<div class="card"><h2>Qarzlar</h2><span class="mut">Bank tasdiqlamagan qarz yoʻq.</span></div>';
  return`<div class="card"><h2>Qarzlar (bank tasdiqlamagan)</h2><div class="mut">Mijozlar sizga:</div>${row(db.rec,'ok')}<div class="mut" style="margin-top:8px">Siz taʼminotchilarga:</div>${row(db.pay,'warn')}</div>`;
}
function stats(d,m){
  const ds=d.docs.filter(x=>x.date.startsWith(m));
  const s=ds.filter(x=>x.type==='sotuv'),h=ds.filter(x=>x.type==='xarid');
  const sum=a=>a.reduce((t,x)=>t+x.sum,0), v=a=>a.reduce((t,x)=>t+vatOf(x),0);
  const out=v(s),inn=v(h);
  const tx=taxOf(d),turn=sum(s)*tx.rate/100;
  return{sales:sum(s),buys:sum(h),outVat:out,inVat:inn,pay:out-inn,turn,tax:tx.mode==='qqs'?out-inn:turn,mode:tx.mode,rate:tx.rate,profit:sum(s)-sum(h),n:ds.length};
}
function daysLeft(dt){return Math.ceil((new Date(dt+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5)}
function nextMonthDay(m,day){const[y,mm]=m.split('-').map(Number);const dt=new Date(y,mm,day);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}

/* ---- ekranlar ---- */

let PEND=null;
function normDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return new Date(v.getTime()+432e5).toISOString().slice(0,10);
  const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return m[1]+'-'+m[2]+'-'+m[3];
  if(m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/))return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return null;
}
function num(v){
  if(typeof v==='number')return v;
  if(v==null)return NaN;
  let s=String(v).replace(/[\s\u00a0]/g,'');
  if(s==='')return NaN;
  if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');
  else if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(',','.');
  return /^-?\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN;
}
function parseDelim(txt,dl){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"'&&cur==='')q=true;
    else if(c===dl){row.push(cur.trim());cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cur.trim());cur='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else cur+=c}
  row.push(cur.trim());if(row.some(x=>x!==''))rows.push(row);
  return rows;
}
function readRows(file){return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onerror=()=>rej(new Error('Fayl oʻqilmadi'));
  fr.onload=()=>{try{
    const buf=fr.result;
    if(/\.json$/i.test(file.name)){
      let j=JSON.parse(new TextDecoder('utf-8').decode(buf));if(!Array.isArray(j))j=j.items||j.data||j.results||[];
      if(!j.length||typeof j[0]!=='object')throw new Error('JSON ichida roʻyxat topilmadi');
      const keys=[];j.forEach(o=>Object.keys(o).forEach(k=>{if(keys.indexOf(k)<0)keys.push(k)}));
      return res([keys].concat(j.map(o=>keys.map(k=>o[k]==null?'':(typeof o[k]==='object'?JSON.stringify(o[k]):o[k])))));
    }
    if(/\.xlsx?$/i.test(file.name)){
      if(!window.XLSX)throw new Error('Excel kutubxonasi yuklanmadi (internet kerak)');
      const wb=XLSX.read(buf,{type:'array',cellDates:true});
      return res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}));
    }
    let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){txt=new TextDecoder('windows-1251').decode(buf)}
    const lines=txt.split(/\r?\n/).filter(l=>l.trim());
    const dl=['#',';','\t','|',','].map(c=>[c,lines.slice(0,20).reduce((a,l)=>a+(l.split(c).length-1),0)]).sort((a,b)=>b[1]-a[1])[0][0];
    res(parseDelim(txt,dl));
  }catch(e){rej(e)}};
  fr.readAsArrayBuffer(file);
})}
function guess(rows){
  const sm=rows.slice(0,200),n=Math.max(0,...sm.map(r=>r.length)),dc=[],nu=[],tx=[];
  for(let i=0;i<n;i++){let d=0,m=0,t=0,c=0,mx=0;
    sm.forEach(r=>{const v=r[i];if(v===''||v==null)return;c++;
      if(normDate(v))d++;else if(!isNaN(num(v))){m++;mx=Math.max(mx,Math.abs(num(v)))}else t+=String(v).length});
    dc.push(d);nu.push(m>=2&&mx>=1000?m:0);tx.push(c?t/c:0)}
  const date=dc.indexOf(Math.max(...dc)),numc=[];
  nu.forEach((m,i)=>{if(i!==date&&m>0)numc.push(i)});
  return{date,desc:tx.indexOf(Math.max(...tx)),num:numc};
}
function opts(rows,ref,sel,none){
  const n=Math.max(0,...rows.slice(0,50).map(r=>r.length));
  let h=none?`<option value="-1" ${sel===-1?'selected':''}>— yoʻq —</option>`:'';
  for(let i=0;i<n;i++)h+=`<option value="${i}" ${i===sel?'selected':''}>${i+1}: ${esc(String(ref[i]??'').slice(0,18))}</option>`;
  return h;
}
function importCard(kind){
  const bank=kind==='bank';
  let h=`<div class="card"><h2>${bank?'Bank':'Hujjat'} · fayldan yuklash</h2><input id="f_${kind}" type="file" accept=".xlsx,.xls,.csv,.txt,.tsv"><div class="note">Excel, CSV yoki TXT. Keyin ustunlarni tanlaysiz. Qayta yuklasangiz takrorlar qoʻshilmaydi.</div>${bank?'<div style="margin-top:8px"><button class="s" data-a="clrbank">Bank harakatlarini tozalash</button></div>':''}</div>`;
  if(PEND&&PEND.kind===kind){
    const g=guess(PEND.rows),ref=PEND.rows.find(r=>r.some(v=>normDate(v)))||PEND.rows[0]||[];
    const nm=(l,id,sel,none)=>`<div><label class="mut">${l}</label><select id="${id}">${opts(PEND.rows,ref,sel,none)}</select></div>`;
    const body=bank
      ?nm('Sana','m_date',g.date)+nm('Izoh (hujjat raqami shu yerda)','m_desc',g.desc)+nm('Kirim yoki summa','m_in',g.num[0]??-1,true)+nm('Chiqim (alohida ustun boʻlsa)','m_out',g.num[1]??-1,true)
      :nm('Sana','m_date',g.date)+nm('Hujjat raqami','m_no',-1,true)+nm('Kontragent','m_party',g.desc,true)+nm('Summa','m_sum',g.num[0]??-1)+nm('Turi (sotuv/xarid)','m_type',-1,true)

function checks(d){
  const L=[],r=reconcile(d),t=today(),s=stats(d,S.month);
  const none=r.rows.filter(x=>x.st==='none'),diff=r.rows.filter(x=>x.st==='diff');
  if(none.length)L.push({c:'bad',t:`${none.length} ta hujjat bankda topilmadi (${fmt(none.reduce((a,x)=>a+x.doc.sum,0))} soʻm)`,
    w:'toʻlov hali qilinmagan (qarz), boshqa hisob raqamdan oʻtgan, yoki bank izohida hujjat raqami yoʻq va summa boshqacha.',
    f:'Qarz boʻlsa uni muddat bilan yozib qoʻying. Toʻlangan boʻlsa “Bank” boʻlimida koʻchirmani yangilang.'});
  if(diff.length)L.push({c:'warn',t:`${diff.length} ta hujjatda summa farqi bor (jami ${fmt(diff.reduce((a,x)=>a+x.diff,0))} soʻm)`,
    w:'qisman toʻlov, chegirma, bank komissiyasi yoki hujjatga summa xato kiritilgan boʻlishi mumkin.',
    f:'“Bank” boʻlimida farqli qatorni oching, hujjat va toʻlov summasini solishtiring. Kerak boʻlsa hujjatni tuzating.'});
  if(r.extra.length)L.push({c:'warn',t:`${r.extra.length} ta bank harakati hujjatsiz (${fmt(r.extra.reduce((a,b)=>a+b.sum,0))} soʻm)`,
    w:'avans, kredit yoki qarz, ichki oʻtkazma, soliq toʻlovi yoki hujjat hali kiritilmagan.',
    f:'Har birining sababini aniqlang. Hujjati yoʻq boʻlsa, hujjatni kiriting yoki buxgalteriyada toʻgʻri hisobga qoʻying.'});
  const seen={};d.docs.forEach(x=>{if(!x.no)return;const k=x.type+'|'+x.no.toLowerCase()+'|'+(x.party||'').toLowerCase();seen[k]=(seen[k]||0)+1});
  const dup=Object.keys(seen).filter(k=>seen[k]>1);
  if(dup.length)L.push({c:'bad',t:`${dup.length} ta hujjat raqami takrorlangan`,w:'bir hujjat ikki marta kiritilgan boʻlishi mumkin. Bu summani va QQSni ikki hissa qiladi.',f:'“Hujjat” roʻyxatida bir xil raqamli qatorlarni topib, ortiqchasini oʻchiring.'});
  const fut=d.docs.filter(x=>x.date>t).length;
  if(fut)L.push({c:'warn',t:`${fut} ta hujjat kelajak sanasi bilan`,w:'sana xato yozilgan boʻlishi mumkin.',f:'Sanani tekshiring.'});
  const nn=d.docs.filter(x=>!x.no).length;
  if(nn)L.push({c:'warn',t:`${nn} ta hujjatda raqam yoʻq`,w:'raqamsiz hujjatni bank toʻlovi bilan faqat summa orqali bogʻlash mumkin, bu xatoga olib kelishi mumkin.',f:'Hujjat raqamini kiriting.'});
  if(s.mode==='qqs'&&s.inVat>s.outVat&&s.inVat>0)L.push({c:'warn',t:`${S.month}: xariddan QQS sotuvdagidan katta`,w:'oy davomida koʻproq xarid qilingan yoki sotuv hujjatlari hali kiritilmagan.',f:'Sotuv hujjatlari toʻliqligini tekshiring. Ortiqcha QQSni keyingi oyga oʻtkazish yoki qaytarish masalasini buxgalter bilan hal qiling.'});
  d.dl.filter(x=>!x.done).forEach(x=>{const n=daysLeft(x.date);
    if(n<0)L.push({c:'bad',t:`Muddat oʻtgan: ${esc(x.title)} (${-n} kun)`,w:'muddat oʻtib ketgan va bajarilgan deb belgilanmagan.',f:'Bajarilgan boʻlsa ✓ bosing. Boʻlmasa darrov bajaring, jarima boʻlishi mumkin.'});
    else if(n<=5)L.push({c:'warn',t:`Yaqin muddat: ${esc(x.title)} (${n} kun qoldi)`,w:'muddatga oz qoldi.',f:'Hujjatlarni tayyorlang.'})});
  return L;
}

async function ensureAuth(){
  if(!S.sess)throw new Error('Kirilmagan');
  if(Date.now()<S.sess.exp)return;
  const r=await fetch(S.cfg.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:S.cfg.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.sess.rt})});
  const j=await r.json();if(!r.ok){S.sess=null;throw new Error('Qayta kiring')}setSess(j);
}
async function sb(path,opt){
  opt=opt||{};await ensureAuth();
  const r=await fetch(S.cfg.url+'/rest/v1/'+path,{method:opt.method||'GET',body:opt.body,headers:Object.assign({apikey:S.cfg.key,Authorization:'Bearer '+S.sess.at,'Content-Type':'application/json'},opt.headers||{})});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,140));
  return r.status===204?null:r.json();
}
const arrOf=(d,k)=>k==='doc'?d.docs:k==='bank'?d.bank:k==='file'?(d.files=d.files||[]):d.dl;
async function syncPush(){
  const up=[],seen={};
  Object.keys(S.cos).forEach(co=>['doc','bank','dl','file'].forEach(k=>arrOf(S.cos[co],k).forEach(x=>{
    const key=co+'|'+k+'|'+x.id,js=JSON.stringify(x);seen[key]=1;
    if(S.hash[key]!==js)up.push({co,kind:k,id:x.id,data:x,deleted:false,ts:Date.now(),_k:key,_js:js})})));
  Object.keys(S.hash).forEach(key=>{if(!seen[key]){const p=key.split('|');up.push({co:p[0],kind:p[1],id:p[2],data:{},deleted:true,ts:Date.now(),_k:key,_js:null})}});
  for(let i=0;i<up.length;i+=400){
    const part=up.slice(i,i+400);
    await sb('rows?on_conflict=co,kind,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(part.map(u=>({co:u.co,kind:u.kind,id:u.id,data:u.data,deleted:u.deleted,ts:u.ts})))});
    part.forEach(u=>{if(u._js===null)delete S.hash[u._k];else S.hash[u._k]=u._js});
  }
  return up.length;
}
async function syncPull(){
  let total=0;
  for(;;){
    const rows=await sb('rows?select=co,kind,id,data,deleted,ts&ts=gt.'+S.lastPull+'&order=ts.asc&limit=1000');
    rows.forEach(r=>{
      const d=S.cos[r.co];if(!d)return;
      const arr=arrOf(d,r.kind),i=arr.findIndex(x=>x.id===r.id),key=r.co+'|'+r.kind+'|'+r.id;
      if(r.deleted){if(i>=0)arr.splice(i,1);delete S.hash[key]}
      else{if(i>=0)arr[i]=r.data;else arr.push(r.data);S.hash[key]=JSON.stringify(r.data)}
      S.lastPull=Math.max(S.lastPull,r.ts);
    });
    total+=rows.length;if(rows.length<1000)break;
  }
  return total;
}
function syncSoon(){if(!S.cfg.url||!S.sess)return;clearTimeout(t0);t0=setTimeout(()=>syncAll(false),1200)}
async function syncAll(manual){
  if(busy||!S.cfg.url||!S.sess)return;busy=true;setSyn('⟳');
  try{
    await syncPush();const n=await syncPull();S.last=Date.now();
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    setSyn('☁ ✓');if(n||manual)render();
  }catch(e){setSyn('☁ xato');if(manual)alert('Sinxron xato: '+e.message)}
  finally{busy=false}
}

async function stoReq(method,path,opt){
  opt=opt||{};await ensureAuth();
  return fetch(S.cfg.url+'/storage/v1/'+path,{method,headers:Object.assign({apikey:S.cfg.key,Authorization:'Bearer '+S.sess.at},opt.headers||{}),body:opt.body});
}
async function uploadFile(file,meta){
  const slug=S.co.toLowerCase().replace(/[^a-z0-9]+/g,'-'),safe=file.name.replace(/[^\w.\-]+/g,'_');
  const path=slug+'/'+uid()+'_'+safe;
  const r=await stoReq('POST','object/hujjatlar/'+path,{headers:{'Content-Type':file.type||'application/octet-stream'},body:file});
  if(!r.ok)throw new Error('Yuklash xato: '+r.status+' '+(await r.text()).slice(0,120));
  D().files.push({id:uid(),path,name:file.name,size:file.size,mime:file.type||'',cat:meta.cat||'Boshqa',title:meta.title||file.name,note:meta.note||'',date:today()});
}
async function openFile(id,w){
  const f=D().files.find(x=>x.id===id);if(!f)throw new Error('Fayl topilmadi');
  const r=await stoReq('POST','object/sign/hujjatlar/'+f.path,{headers:{'Content-Type':'application/json'},body:JSON.stringify({expiresIn:300})});
  const j=await r.json();if(!r.ok)throw new Error('Ochilmadi: '+(j.message||r.status));
  const u=S.cfg.url+'/storage/v1'+j.signedURL;if(w)w.location=u;else window.open(u,'_blank');
}

function shiftMonth(m,k){const q=m.split('-').map(Number);const d=new Date(q[0],q[1]-1+k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function short(n){n=Math.abs(n);return n>=1e9?(n/1e9).toFixed(1)+' mlrd':n>=1e6?(n/1e6).toFixed(1).replace('.0','')+' mln':n>=1e3?Math.round(n/1e3)+' ming':String(Math.round(n))}
function barChart(data){
  const W=640,H=230,L=70,B=28,T=14,R=10,pw=W-L-R,ph=H-T-B,mx=Math.max(1,...data.map(x=>Math.max(x.a,x.b)));
  const mag=Math.pow(10,Math.floor(Math.log10(mx))),top=[1,1.5,2,2.5,3,4,5,6,8,10].map(x=>x*mag).find(x=>x>=mx)||mx;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Sotuv va xarid diagrammasi">`;
  if(!data.some(x=>x.a||x.b))return s+`<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="14" fill="var(--mut)">Hali maʼlumot yoʻq. Hujjat qoʻshilgach diagramma shu yerda chiqadi.</text></svg>`;
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mut)">${short(top*i/4)}</text>`}
  const gw=pw/data.length,bw=Math.min(26,gw*.28);
  data.forEach((d,i)=>{const cx=L+gw*i+gw/2,ha=ph*d.a/top,hb=ph*d.b/top;
    s+=`<rect x="${cx-bw-2}" y="${T+ph-ha}" width="${bw}" height="${Math.max(ha,d.a?2:0)}" rx="4" fill="var(--acc)"/><rect x="${cx+2}" y="${T+ph-hb}" width="${bw}" height="${Math.max(hb,d.b?2:0)}" rx="4" fill="#f59e0b"/>`+
       `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--mut)">${d.l}</text>`});
  return s+'</svg>';
}
function donut(rows){
  const c={ok:0,diff:0,none:0};rows.forEach(x=>c[x.st]++);const tot=rows.length,C=2*Math.PI*38;
  const col={ok:'var(--ok)',diff:'var(--warn)',none:'var(--bad)'},lb={ok:'Mos',diff:'Summa farqi',none:'Bankda yoʻq'};
  let acc=0,seg='';
  if(tot)['ok','diff','none'].forEach(k=>{if(!c[k])return;const len=C*c[k]/tot;seg+=`<circle cx="50" cy="50" r="38" fill="none" stroke="${col[k]}" stroke-width="12" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}"/>`;acc+=len});
  const pct=tot?Math.round(c.ok/tot*100):0;
  return`<div class="don"><svg viewBox="0 0 100 100" width="130" height="130"><g transform="rotate(-90 50 50)"><circle cx="50" cy="50" r="38" fill="none" stroke="var(--line)" stroke-width="12"/>${seg}</g><text x="50" y="${tot?55:53}" text-anchor="middle" font-size="${tot?18:9}" font-weight="700" fill="var(--tx)">${tot?pct+'%':'Hujjat yoʻq'}</text></svg>
  <div>${['ok','diff','none'].map(k=>`<div class="item" style="border:0;padding:4px 0;gap:14px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${col[k]};margin-right:8px"></i>${lb[k]}</span><b>${c[k]}</b></div>`).join('')}</div></div>`;
}

function dlRow(x,ctl){

/* ---- yordamchi ---- */
function answer(q){
  q=q.toLowerCase().replace(/[ʻʼ’`']/g,'');const d=D(),s=stats(d,S.month),r=reconcile(d);
  const has=(...w)=>w.some(x=>q.includes(x));
  if(has('nega','sabab','tushuntir','muammo')){const ck=checks(d);return ck.length?ck.slice(0,4).map(x=>`• ${x.t.replace(/<[^>]+>/g,'')}\n  Nega: ${x.w}\n  Nima qilish: ${x.f}`).join('\n\n'):'Hozir tekshiruvda muammo topilmadi.'}
  if(has('namuna','shablon','dalolatnoma','ustav','bayonnoma','buyruq','ishonchnoma','shartnoma'))return'“Namuna” boʻlimida shablonni tanlang, maydonlarni toʻldiring va “Hosil qilish”ni bosing. Natijani chop etish/PDF, Word yoki arxivga saqlash mumkin. Tayyor fayllaringizni “Arxiv” boʻlimiga yuklang.';
  if(has('orgat','qanday','nima','1c','didox','osv')){
    if(has('1c','osv'))return TEACH.osv;if(has('didox'))return TEACH.didox;if(has('bank','fayl','yukla'))return TEACH.bank;if(has('aylanma'))return TEACH.aylanma;if(has('qqs','soliq'))return taxOf(d).mode==='qqs'?TEACH.qqs:TEACH.aylanma;
    return'Nimani oʻrgatay? Yozing: “qqs”, “aylanma soliq”, “bank fayli”, “1c hisobot”, “didox”.';}
  if(has('qqs','soliq','aylanma'))return s.mode==='qqs'?`${S.month} uchun: sotuvdan QQS ${fmt(s.outVat)}, xariddan ${fmt(s.inVat)}. Toʻlanadigan QQS: ${fmt(s.pay)} soʻm.`:`${S.month} uchun aylanma ${fmt(s.sales)} soʻm, stavka ${s.rate}%. Aylanma soliq: ${fmt(s.turn)} soʻm (taxminiy).`;
  if(has('farq','bank','solishtir')){const b=r.rows.filter(x=>x.st!=='ok');return b.length||r.extra.length?`${b.length} ta hujjatda muammo, ${r.extra.length} ta bank harakati hujjatsiz.\n`+b.slice(0,5).map(x=>`• ${x.doc.no||'—'}: ${x.st==='diff'?'farq '+fmt(x.diff):'toʻlov topilmadi'}`).join('\n'):'Hammasi mos.'}
  if(has('muddat','eslat','qachon')){const l=d.dl.filter(x=>!x.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);return l.length?l.map(x=>`• ${x.title}: ${x.date} (${daysLeft(x.date)} kun)`).join('\n'):'Muddat qoʻyilmagan.'}
  if(has('qarz','tolanmagan','kim')){const db=debts(d),f=a=>a.slice(0,5).map(x=>`• ${x.party}: ${fmt(x.sum)}`).join('\n')||'—';return`Mijozlar sizga qarz (bank tasdiqlamagan):\n${f(db.rec)}\n\nSiz taʼminotchilarga:\n${f(db.pay)}`}
  if(has('xarid','xarajat','chiqim'))return`${S.month} xarid: ${fmt(s.buys)} soʻm.`;
  if(has('ishla','foyda','daromad','sotuv','savdo'))return`${S.month} sotuv: ${fmt(s.sales)}, xarid: ${fmt(s.buys)}. Farq: ${fmt(s.profit)} soʻm (${s.n} ta hujjat).`;
  return'Tushunmadim. Soʻrang: sotuv, xarid, QQS, bank bilan farq, qarz yoki muddatlar.';
}

/* ---- amallar ---- */
function parseBank(t){
  let n=0;
  t.split('\n').forEach(line=>{
    const p=line.split(/[;\t]/).map(x=>x.trim());if(p.length<3)return;
    const raw=parseFloat(p[p.length-1].replace(/\s/g,'').replace(',','.'));
    if(!/^\d{4}-\d{2}-\d{2}/.test(p[0])||isNaN(raw))return;
    D().bank.push({id:uid(),date:p[0].slice(0,10),desc:p.slice(1,-1).join(' '),sum:Math.abs(raw),dir:raw<0?'out':'in'});n++;
  });
  return n;
}
